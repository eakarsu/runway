name: governed-workflow-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: runway_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d runway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/runway_test
      BACKUP_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/runway_test
      JWT_SECRET: ci-only-random-secret-longer-than-thirty-two-characters
      CORS_ORIGIN: http://127.0.0.1:5173
      SERVER_PORT: '3001'
      CLIENT_PORT: '5173'
      ALLOW_PUBLIC_REGISTRATION: 'true'
      ENABLE_PROTOTYPE_ROUTES: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm run migrate
        working-directory: server
      - name: Verify migration replay and checksums
        run: |
          npm run migrate
          npm run migrate:check
        working-directory: server
      - run: npm run syntax
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm run test:integration
        working-directory: server
      - run: npm run audit:all
        working-directory: server
      - run: npm run lint
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npm run audit:all
        working-directory: client
      - name: Verify prepared runtime and occupied-port failure
        run: |
          ./start.sh >runway-start.log 2>&1 &
          runway_pid=$!
          trap 'kill "$runway_pid" 2>/dev/null || true; wait "$runway_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:5173/login >/dev/null && curl --fail --silent http://127.0.0.1:3001/api/ready >/dev/null && break
            kill -0 "$runway_pid"
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:5173/login >/dev/null
          curl --fail --silent http://127.0.0.1:3001/api/boundary | grep 'private-project-review-version-and-export'
          if ./start.sh >second-start.log 2>&1; then exit 1; fi
          kill -0 "$runway_pid"
      - name: Verify backup and isolated restore
        run: |
          backup_dir="$(mktemp -d)"
          backup_path="$(./scripts/backup-database.sh "$backup_dir")"
          ./scripts/verify-backup.sh "$backup_path"
          PGPASSWORD=postgres createdb --host 127.0.0.1 --port 5432 --username postgres runway_restore
          pg_restore --no-owner --no-privileges --dbname postgresql://postgres:postgres@127.0.0.1:5432/runway_restore "$backup_path"
          test "$(psql postgresql://postgres:postgres@127.0.0.1:5432/runway_restore -Atc 'SELECT COUNT(*) FROM "SchemaMigrations"')" -ge 1
          test "$(psql postgresql://postgres:postgres@127.0.0.1:5432/runway_restore -Atc 'SELECT COUNT(*) FROM "AuditEvents"')" -ge 1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
